name: Update payload releases

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'UTC'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-payloads.yml'
      - 'scripts/update_payloads.py'

permissions:
  contents: write

concurrency:
  group: update-payloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_payloads.py

      - name: Commit changes
        run: |
          if git diff --quiet -- payloads.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payloads.json
          git commit -m 'Update payloads to latest upstream releases'
          git push
